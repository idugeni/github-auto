[project]
name = "github-auto"
version = "0.1.0"
description = "Automated GitHub account creation with anti-detection"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45.0",
    "camoufox[geoip]>=0.1.0",
    "patchright>=1.0.0",
    "curl_cffi>=0.7.0",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "tenacity>=8.0.0",
    "requests>=2.31.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
github-auto = "cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["src*", "config*", "providers*"]
